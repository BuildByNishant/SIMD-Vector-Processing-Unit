name: simulation
on: [push, pull_request]
jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y iverilog python3-matplotlib
      - name: Run unit test + 20 system simulations
        run: bash scripts/run_all.sh
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
